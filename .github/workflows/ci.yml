name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native -C link-arg=-s"
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "gpu-vulkan,codec-ffmpeg,audio-cpal"
            profile: release
            binary_name: davinci-clone
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "gpu-dx12,codec-ffmpeg,audio-cpal"
            profile: release
            binary_name: davinci-clone.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            features: "gpu-metal,codec-ffmpeg,audio-cpal"
            profile: release
            binary_name: davinci-clone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config \
            cmake \
            clang \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libsdl2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            vulkan-sdk \
            cmake \
            pkg-config \
            ffmpeg \
            sdl2

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install vulkan-sdk cmake pkg-config ffmpeg sdl2 --no-progress

      - name: Build
        run: |
          cargo build --profile ${{ matrix.profile }} --features "${{ matrix.features }}" --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }}

      - name: Check binary size
        run: |
          BINARY="target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary_name }}"
          if [ -f "$BINARY" ]; then
            SIZE=$(stat -c%s "$BINARY" 2>/dev/null || stat -f%z "$BINARY" 2>/dev/null)
            echo "Binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
            if [ $SIZE -gt 47185920 ]; then
              echo "::warning::Binary exceeds 45MB limit!"
            fi
          else
            echo "Binary not found at $BINARY"
            ls -la target/${{ matrix.target }}/${{ matrix.profile }}/ || true
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: davinci-clone-${{ matrix.os }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary_name }}
          retention-days: 7

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests
        run: cargo test --lib --features "gpu-vulkan,codec-ffmpeg,audio-cpal"
      - name: Run integration tests
        run: cargo test --features "gpu-vulkan,codec-ffmpeg,audio-cpal" -- --test-threads=1
      - name: Run doc tests
        run: cargo test --doc --features "gpu-vulkan,codec-ffmpeg,audio-cpal"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check for unused dependencies
        run: cargo machete

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Run benchmarks
        run: cargo bench --features "gpu-vulkan,codec-ffmpeg,audio-cpal,profiling" -- --save-baseline main
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test, lint, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/davinci-clone*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate docs
        run: cargo doc --features "gpu-vulkan,codec-ffmpeg,audio-cpal" --no-deps
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/doc