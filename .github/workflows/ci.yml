name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native -C link-arg=-s -C codegen-units=1"
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "gpu-vulkan,codec-ffmpeg,audio-cpal"
            profile: release
            binary_name: davinci-clone
            test_features: "gpu-vulkan,codec-ffmpeg,audio-cpal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "gpu-dx12,codec-ffmpeg,audio-cpal"
            profile: release
            binary_name: davinci-clone.exe
            test_features: "gpu-dx12,codec-ffmpeg,audio-cpal"
          - os: macos-latest
            target: x86_64-apple-darwin
            features: "gpu-metal,codec-ffmpeg,audio-cpal"
            profile: release
            binary_name: davinci-clone
            test_features: "gpu-metal,codec-ffmpeg,audio-cpal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config \
            cmake \
            clang \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libsdl2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          brew install \
            vulkan-sdk \
            cmake \
            pkg-config \
            ffmpeg \
            sdl2

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: |
          # Install Vulkan SDK
          choco install vulkan-sdk --no-progress --timeout=600
          
          # cmake is pre-installed on windows-latest
          cmake --version
          
          # Install pkg-config via scoop (more reliable than choco)
          scoop install pkg-config
          
          # Install ffmpeg
          choco install ffmpeg --no-progress --timeout=300
          
          # Install SDL2 via vcpkg (pre-installed on windows-latest)
          vcpkg install sdl2:x64-windows --triplet x64-windows
          
          # Add vcpkg installed binaries to PATH
          echo "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        timeout-minutes: 35
        run: |
          cargo build --profile ${{ matrix.profile }} --features "${{ matrix.features }}" --target ${{ matrix.target }} --locked
        env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
          CARGO_BUILD_JOBS: 2

      - name: Check binary size
        run: |
          BINARY="target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary_name }}"
          if [ -f "$BINARY" ]; then
            SIZE=$(stat -c%s "$BINARY" 2>/dev/null || stat -f%z "$BINARY" 2>/dev/null)
            echo "Binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
            if [ $SIZE -gt 47185920 ]; then
              echo "::warning::Binary exceeds 45MB limit!"
            fi
          else
            echo "Binary not found at $BINARY"
            ls -la target/${{ matrix.target }}/${{ matrix.profile }}/ || true
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: davinci-clone-${{ matrix.os }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary_name }}
          retention-days: 3

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "gpu-vulkan,codec-ffmpeg,audio-cpal"
          - os: windows-latest
            features: "gpu-dx12,codec-ffmpeg,audio-cpal"
          - os: macos-latest
            features: "gpu-metal,codec-ffmpeg,audio-cpal"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests
        timeout-minutes: 15
        run: cargo test --lib --features "${{ matrix.features }}" -- --test-threads=2 --nocapture
      - name: Run doc tests
        timeout-minutes: 10
        run: cargo test --doc --features "${{ matrix.features }}"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # v1: lint is advisory. `clippy -D warnings` and `cargo machete` are strict and
    # the codebase is not yet warning-clean, so these report findings without
    # blocking the build. Flip `continue-on-error` to false once they are clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          profile: minimal
      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check
      - name: Run clippy (advisory)
        timeout-minutes: 15
        run: cargo clippy --all-targets --features "gpu-vulkan,codec-ffmpeg,audio-cpal"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # v1: advisory only - upstream advisories should not block feature work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - name: Install cargo-audit
        timeout-minutes: 5
        run: cargo install cargo-audit --locked --no-track
      - name: Audit dependencies (advisory)
        timeout-minutes: 10
        run: cargo audit

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - name: Generate docs
        timeout-minutes: 15
        run: cargo doc --features "gpu-vulkan,codec-ffmpeg,audio-cpal" --no-deps --document-private-items
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/doc