name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  # Keep flags OUT of the global env: `-C target-cpu=native` breaks cross-compiles
  # and `-C codegen-units=1` is already set in the release profile.
  RUSTFLAGS: "-C link-arg=-s"

jobs:
  verify:
    name: Verify (compiles + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "gpu-vulkan,codec-ffmpeg,audio-cpal"
            label: linux-full
          - features: "gpu-dx12,codec-ffmpeg,audio-cpal"
            label: linux-dx12
          - features: "gpu-metal,codec-ffmpeg,audio-cpal"
            label: linux-metal
          - features: "cpu-only"
            label: linux-cpu-only
          - features: ""
            label: linux-core-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libvulkan-dev libasound2-dev libudev-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config cmake clang \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev libsdl2-dev

      # `cargo check` is used rather than `build`: it never invokes the linker, so it
      # validates every module without needing FFmpeg/SDL shared libs at link time.
      - name: cargo check
        id: check
        continue-on-error: true
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --features "${{ matrix.features }}" 2>&1 | tee check-output.txt
          else
            cargo check --no-default-features 2>&1 | tee check-output.txt
          fi

      # Surface rustc diagnostics as check annotations. GitHub only keeps these in the
      # job log otherwise, which makes CI failures hard to diagnose from the API.
      - name: Annotate compiler errors
        if: always()
        run: |
          if [ ! -f check-output.txt ]; then
            echo "::notice::cargo check produced no output file"
            exit 0
          fi
          # Emit one annotation per error, capped to stay within annotation limits.
          grep -E '^error(\[E[0-9]+\])?:' check-output.txt | head -50 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | cut -c1-240)
            echo "::error title=cargo::${msg}"
          done
          echo "---"
          echo "Total errors: $(grep -cE '^error(\[E[0-9]+\])?:' check-output.txt || true)"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --lib --features "${{ matrix.features }}" 2>&1 | tee test-output.txt
          else
            cargo test --lib --no-default-features 2>&1 | tee test-output.txt
          fi

      - name: Annotate test errors
        if: always()
        run: |
          [ -f test-output.txt ] || exit 0
          grep -E '^error(\[E[0-9]+\])?:|panicked at|^test result: FAILED' test-output.txt | head -30 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | cut -c1-240)
            echo "::error title=test::${msg}"
          done

      # Fail the job only after annotations have been emitted, so the compiler
      # output is always captured regardless of outcome.
      - name: Enforce results
        if: always()
        run: |
          echo "check -> ${{ steps.check.outcome }}"
          echo "tests -> ${{ steps.tests.outcome }}"
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            echo "::error::cargo check failed"
            exit 1
          fi
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::cargo test failed"
            exit 1
          fi

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libvulkan-dev libasound2-dev libudev-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config cmake clang \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev libsdl2-dev

      - name: cargo build (release)
        id: build
        continue-on-error: true
        run: |
          cargo build --release --features "gpu-vulkan,codec-ffmpeg,audio-cpal" 2>&1 | tee build-output.txt

      - name: Annotate build errors
        if: always()
        run: |
          [ -f build-output.txt ] || exit 0
          grep -E '^error(\[E[0-9]+\])?:|cannot find|undefined reference|collect2:|ld returned|rust-lld: error' build-output.txt \
            | head -40 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | tr -d '\r' | cut -c1-240)
              echo "::error title=release-build::${msg}"
            done

      - name: Enforce release build
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::release build failed"
            exit 1
          fi

      - name: Check binary size
        run: |
          BINARY="target/release/davinci-clone"
          if [ ! -f "$BINARY" ]; then
            echo "::error::Binary not found at $BINARY"
            exit 1
          fi
          SIZE=$(stat -c%s "$BINARY")
          echo "Binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          if [ $SIZE -gt 47185920 ]; then
            echo "::warning::Binary exceeds 45MB target"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: davinci-clone-linux-x86_64
          path: target/release/davinci-clone
          retention-days: 7

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (advisory)
        run: cargo clippy --all-targets --no-default-features

  security:
    name: Security Audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --no-track
      - name: cargo audit (advisory)
        run: cargo audit
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'