[package]
name = "davinci-clone"
version = "0.1.0"
edition = "2021"
description = "Lightweight DaVinci Resolve clone in Rust - Edit Page focused"
authors = ["Eliene-byte"]
license = "MIT"
repository = "https://github.com/Eliene-byte/Diamond-editor"

[profile.release]
opt-level = "z"
# `thin` LTO keeps binary size close to full LTO but uses far less peak memory,
# which matters on CI runners where full LTO over this dependency graph can OOM.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace]
members = []

[features]
default = ["gpu-vulkan", "codec-ffmpeg", "audio-cpal"]
# Hardware acceleration backends
# NOTE: use `wgpu/vulkan` (native Vulkan), NOT `vulkan-portability` (which is the
# MoltenVK shim intended for macOS and enables no backend on Linux).
gpu-vulkan = ["wgpu/vulkan"]
gpu-metal = ["wgpu/metal"]
gpu-dx12 = ["wgpu/dx12"]
gpu-gl = ["wgpu/glsl"]
# Software rendering fallback (works on ALL hardware)
gpu-software = ["wgpu/glsl"]
# Codecs
codec-ffmpeg = ["dep:ffmpeg-next"]
codec-system = []
# Audio
# cpal's default backend set (ALSA on Linux, WASAPI on Windows, CoreAudio on macOS)
# is what CI and end users have. Enabling `jack` would require libjack dev headers,
# which are not present on stock runners.
audio-cpal = ["dep:cpal"]
audio-minimal = ["dep:cpal"]
# UI
ui-egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
ui-minimal = []
# CPU-only rendering (no GPU required)
cpu-only = ["gpu-software", "codec-ffmpeg", "audio-cpal", "ui-minimal"]
# Performance
simd = []
profiling = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Core
anyhow = { version = "1.0", default-features = false }
thiserror = "1.0"
parking_lot = "0.12"
# `crossbeam` re-exports `crossbeam::channel` when the `crossbeam-channel`
# feature is on. Default features enable it, so no explicit features are listed here.
crossbeam = "0.8"
crossbeam-channel = "0.5"
slotmap = { version = "1.0", default-features = false }
generational-arena = "0.2"
smallvec = { version = "1.0", default-features = false }
smol_str = "0.1"
ahash = "0.8"
bitflags = "2"
num_cpus = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
toml = "0.8"

# Serialization (minimal)
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
rmp-serde = { version = "1.1", default-features = false }
bincode = { version = "1.3", default-features = false }

# Math
glam = { version = "0.27", default-features = false, features = ["scalar-math"] }
kurbo = { version = "0.9", default-features = false }
parley = { version = "0.6", default-features = false, features = [] }
cosmic-text = { version = "0.10", default-features = false }
swash = { version = "0.2", default-features = false }

# GPU / Rendering
wgpu = { version = "23", default-features = false, features = [] }
wgpu-types = "23"
bytemuck = { version = "1.14", default-features = false }
raw-window-handle = "0.6"

# Windowing
winit = { version = "0.30", default-features = false, features = [] }

# UI - egui is lightweight but adds size. We'll use a custom immediate-mode UI on wgpu for minimum size.
egui = { version = "0.30", default-features = false, features = [], optional = true }
egui-wgpu = { version = "0.30", default-features = false, optional = true }
egui-winit = { version = "0.30", default-features = false, optional = true }
epaint = { version = "0.30", default-features = false, optional = true }

# Video/Audio Codecs
ffmpeg-next = { version = "4.2", default-features = false, optional = true }

# Audio
cpal = { version = "0.15", default-features = false, optional = true }
rubato = { version = "0.13", default-features = false, optional = true }
fundsp = { version = "0.5", default-features = false, optional = true }

# Image/Video processing
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "exr", "tiff", "hdr"] }
imageproc = { version = "0.24", default-features = false }

# File handling
notify = { version = "6.0", default-features = false }
walkdir = { version = "2", default-features = false }
ignore = { version = "0.4", default-features = false }
lru = "0.12"
lz4_flex = { version = "0.11", default-features = false }
zstd = "0.13"

# Procedural
rand = "0.8"
rand_chacha = "0.3"

# Async (minimal)
tokio = { version = "1.38", default-features = false, features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }

# Logging
tracing = { version = "0.1", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1.0"

[build-dependencies]
cc = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", default-features = false, features = ["winuser", "wingdi", "winnt", "libloaderapi", "sysinfoapi", "memoryapi", "handleapi", "errhandlingapi", "processthreadsapi", "fileapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", default-features = false }
core-graphics = { version = "0.23", default-features = false }
metal = { version = "0.27", default-features = false }
objc = { version = "0.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", default-features = false, optional = true }
wayland-protocols = { version = "0.31", default-features = false, optional = true }
x11rb = { version = "0.11", default-features = false, optional = true }