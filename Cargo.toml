[package]
name = "davinci-clone"
version = "0.1.0"
edition = "2021"
description = "Lightweight DaVinci Resolve clone in Rust - Edit Page focused"
authors = ["Eliene-byte"]
license = "MIT"
repository = "https://github.com/Eliene-byte/Diamond-editor"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace]
members = []

[features]
default = ["gpu-vulkan", "codec-ffmpeg", "audio-cpal"]
gpu-vulkan = ["wgpu/vulkan"]
gpu-metal = ["wgpu/metal"]
gpu-dx12 = ["wgpu/dx12"]
gpu-gl = ["wgpu/gl"]
codec-ffmpeg = ["ffmpeg-next", "ffmpeg-sys/next"]
codec-system = []
audio-cpal = ["cpal/jack", "cpal/alsa", "cpal/wasapi", "cpal/coreaudio"]
audio-minimal = ["cpal"]
ui-egui = ["egui", "egui-wgpu", "egui-winit"]
ui-minimal = []
simd = ["packed_simd"]
profiling = ["tracing", "tracing-subscriber"]

[dependencies]
# Core
anyhow = { version = "1.0", default-features = false }
thiserror = "1.0"
parking_lot = "0.12"
crossbeam = { version = "0.8", default-features = false }
slotmap = { version = "1.0", default-features = false }
generational-arena = "0.2"
smallvec = { version = "1.0", default-features = false }
smol_str = "0.1"
ahash = "0.8"

# Serialization (minimal)
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
rmp-serde = { version = "1.1", default-features = false }
bincode = { version = "1.3", default-features = false }

# Math
glam = { version = "0.27", default-features = false, features = ["scalar-math", "f32"] }
kurbo = { version = "0.9", default-features = false }
parley = { version = "0.6", default-features = false, features = ["fontdb"] }
cosmic-text = { version = "0.10", default-features = false }
swash = { version = "0.8", default-features = false }

# GPU / Rendering
wgpu = { version = "23", default-features = false, features = [] }
wgpu-types = "23"
bytemuck = { version = "1.14", default-features = false }
raw-window-handle = "0.6"

# Windowing
winit = { version = "0.30", default-features = false, features = [] }

# UI - egui is lightweight but adds size. We'll use a custom immediate-mode UI on wgpu for minimum size.
egui = { version = "0.30", default-features = false, features = [], optional = true }
egui-wgpu = { version = "0.30", default-features = false, optional = true }
egui-winit = { version = "0.30", default-features = false, optional = true }
epaint = { version = "0.30", default-features = false, optional = true }

# Video/Audio Codecs
ffmpeg-next = { version = "6", default-features = false, optional = true }
ffmpeg-sys = { version = "6", default-features = false, optional = true }

# Audio
cpal = { version = "0.15", default-features = false, optional = true }
rubato = { version = "0.14", default-features = false, optional = true }
fundsp = { version = "0.6", default-features = false, optional = true }

# Image/Video processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "tiff", "hdr"] }
imageproc = { version = "0.25", default-features = false }

# File handling
notify = { version = "6.1", default-features = false }
walkdir = { version = "2", default-features = false }
ignore = { version = "0.13", default-features = false }

# Async (minimal)
tokio = { version = "1.38", default-features = false, features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }

# Logging
tracing = { version = "0.1", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1.0"

[build-dependencies]
cc = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", default-features = false, features = ["winuser", "wingdi", "winnt", "libloaderapi", "sysinfoapi", "memoryapi", "handleapi", "errhandlingapi", "processthreadsapi", "fileapi", "pathcch"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", default-features = false }
core-graphics = { version = "0.23", default-features = false }
metal = { version = "0.27", default-features = false }
objc = { version = "0.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", default-features = false, optional = true }
wayland-protocols = { version = "0.31", default-features = false, optional = true }
x11rb = { version = "0.11", default-features = false, optional = true }