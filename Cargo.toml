[package]
name = "davinci-clone"
version = "0.1.0"
edition = "2021"
description = "Lightweight DaVinci Resolve clone in Rust - Edit Page focused"
authors = ["Eliene-byte"]
license = "MIT"
repository = "https://github.com/Eliene-byte/Diamond-editor"

[profile.release]
opt-level = "z"
# `thin` LTO keeps binary size close to full LTO but uses far less peak memory,
# which matters on CI runners where full LTO over this dependency graph can OOM.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace]
members = []

[features]
default = ["gpu-vulkan", "codec-ffmpeg", "audio-cpal"]

# Hardware acceleration backends.
# wgpu 23 backend feature names are: vulkan-portability, metal, dx12, angle.
# (`glsl` is a shader-language feature, NOT a backend.)
gpu-vulkan = ["wgpu/vulkan-portability"]
gpu-metal = ["wgpu/metal"]
gpu-dx12 = ["wgpu/dx12"]
gpu-gl = ["wgpu/angle"]

# Software rendering fallback (works on ALL hardware)
gpu-software = ["wgpu/angle"]

# Codecs
codec-ffmpeg = ["dep:ffmpeg-next"]
codec-system = []

# Audio.
# cpal's default backend set (ALSA on Linux, WASAPI on Windows, CoreAudio on macOS)
# is what CI and end users have. Enabling `jack` would require libjack dev headers,
# which are not present on stock runners.
audio-cpal = ["dep:cpal"]
audio-minimal = ["dep:cpal"]

# The UI is a custom immediate-mode framework on wgpu; there is no egui dependency.
ui-minimal = []

# CPU-only rendering (no GPU required)
cpu-only = ["gpu-software", "codec-ffmpeg", "audio-cpal", "ui-minimal"]

simd = []
profiling = ["dep:tracing-subscriber"]

[dependencies]
# --- Core ---
thiserror = "1.0"
parking_lot = "0.12"
# `crossbeam` re-exports `crossbeam::channel` under its default features.
crossbeam = "0.8"
slotmap = { version = "1.0", default-features = false }
bitflags = "2"
num_cpus = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
toml = "0.8"

# --- Serialization ---
# serde_json needs `std` (or at least `alloc`); it errors out at build time otherwise.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Math ---
glam = { version = "0.27", default-features = false, features = ["scalar-math"] }

# --- GPU / Rendering ---
wgpu = { version = "23", default-features = false, features = [] }
# `derive` provides the Pod/Zeroable derive macros used by the uniform structs.
bytemuck = { version = "1.14", features = ["derive"] }

# --- Windowing ---
# winit gates each platform behind a feature and hard-errors with
# "The platform you're compiling for is not supported by winit" when none is set.
# `x11` + `wayland` cover Linux, `rwh_06` integrates with raw-window-handle 0.6.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }

# --- Video ---
ffmpeg-next = { version = "4.2", default-features = false, optional = true }

# --- Audio ---
cpal = { version = "0.15", default-features = false, optional = true }
rubato = { version = "0.13", default-features = false, optional = true }

# --- Image ---
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "exr", "tiff", "hdr"] }

# --- File handling ---
notify = { version = "6.0", default-features = false }
walkdir = { version = "2", default-features = false }
ignore = { version = "0.4", default-features = false }

# --- Cache ---
lru = "0.12"
lz4_flex = { version = "0.11", default-features = false }
# zstd-sys compiles C code, so zstd needs its default features.
zstd = "0.13"

# --- Procedural ---
rand = "0.8"
rand_chacha = "0.3"

# --- Async ---
tokio = { version = "1.38", default-features = false, features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }

# --- Logging ---
tracing-subscriber = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", default-features = false, features = ["winuser", "wingdi", "winnt", "libloaderapi", "sysinfoapi", "memoryapi", "handleapi", "errhandlingapi", "processthreadsapi", "fileapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", default-features = false }
core-graphics = { version = "0.23", default-features = false }
metal = { version = "0.27", default-features = false }
objc = { version = "0.2", default-features = false }